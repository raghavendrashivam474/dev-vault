<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev-Vault</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Google Fonts for modern typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
</head>
<body>
    <div class="app-container">
        <header class="header glass">
            <div class="header-main">
                <div>
                    <h1>◈ DevVault</h1>
                    <p class="subtitle">Your developer knowledge,<br>ready when you need it.</p>
                </div>
                <div class="header-main-actions">
                    <button id="themeToggleBtn" class="icon-btn" title="Toggle Theme">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>
                    </button>
                    <button id="addBtn" class="primary-btn">+ Add Snippet</button>
                </div>
            </div>
            <div class="header-divider"></div>
            <div class="filter-bar">
                <div class="search-container">
                    <input type="text" id="searchInput" placeholder="Search snippets..." class="search-input">
                    <button id="clearSearchBtn" class="clear-search-btn" title="Clear Search" style="display: none;">&times;</button>
                </div>
                <div class="select-group">
                    <select id="typeFilter" class="search-input select-filter">
                        <option value="all">All Types</option>
                        <option value="snippet">Snippet</option>
                        <option value="command">Command</option>
                        <option value="query">Query</option>
                        <option value="regex">Regex</option>
                        <option value="config">Config</option>
                        <option value="reference">Reference</option>
                        <option value="solution">Solution</option>
                    </select>
                    <select id="langFilter" class="search-input select-filter">
                        <option value="all">All Languages</option>
                        <option value="javascript">JavaScript</option>
                        <option value="html">HTML</option>
                        <option value="css">CSS</option>
                        <option value="python">Python</option>
                        <option value="bash">Bash</option>
                        <option value="plaintext">Plain Text</option>
                    </select>
                    <select id="filterSelect" class="search-input select-filter">
                        <option value="all">All Status</option>
                        <option value="favorites">Favorites</option>
                        <option value="recent">Recent</option>
                    </select>
                    <select id="sortSelect" class="search-input select-filter">
                        <option value="recently_added">Recently Added</option>
                        <option value="recently_updated">Recently Updated</option>
                        <option value="recently_used">Recently Used</option>
                        <option value="title_asc">Title A → Z</option>
                        <option value="title_desc">Title Z → A</option>
                    </select>
                </div>
            </div>
        </header>

        <div class="section-heading">
            <span>YOUR VAULT</span>
            <div class="vault-meta">
                <span class="status-indicator"><span class="dot"></span> LOCAL</span>
                <span class="snippet-count" id="snippetCount">0 ENTRIES</span>
            </div>
        </div>

        <div id="activeFiltersContainer" class="active-filters-bar" style="display: none;">
            <span class="active-filters-label">Active:</span>
            <div id="activeFiltersChips" class="active-filters-chips"></div>
            <button id="clearAllFiltersBtn" class="clear-filters-btn">Clear filters</button>
        </div>
        <main class="snippets-grid" id="snippetsContainer">
            <!-- Snippets will be injected here via JS -->
        </main>

        <footer class="vault-footer">
            <div class="footer-brand">◈ DevVault</div>
            <div class="footer-tagline">Local-first developer knowledge · Offline ready</div>
        </footer>
    </div>

    <!-- Modal for adding snippet -->
    <div class="modal-overlay" id="addModal" style="display: none;">
        <div class="modal glass">
            <h2>Add New Snippet</h2>
            <form id="snippetForm">
                <div class="form-group">
                    <label for="titleInput">Title</label>
                    <input type="text" id="titleInput" required placeholder="e.g. Fetch API Boilerplate">
                </div>
                <div class="form-group">
                    <label for="typeInput">Type</label>
                    <select id="typeInput">
                        <option value="snippet">Snippet</option>
                        <option value="command">Command</option>
                        <option value="query">Query</option>
                        <option value="regex">Regex</option>
                        <option value="config">Config</option>
                        <option value="reference">Reference</option>
                        <option value="solution">Solution</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="languageInput">Language</label>
                    <select id="languageInput">
                        <option value="javascript">JavaScript</option>
                        <option value="html">HTML</option>
                        <option value="css">CSS</option>
                        <option value="python">Python</option>
                        <option value="bash">Bash</option>
                        <option value="plaintext">Plain Text</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="descriptionInput">Description</label>
                    <input type="text" id="descriptionInput" placeholder="Brief description (optional)">
                </div>
                <div class="form-group">
                    <label for="tagsInput">Tags</label>
                    <input type="text" id="tagsInput" placeholder="e.g. docker, api (optional)">
                </div>
                <div class="form-group">
                    <label for="codeInput">Code</label>
                    <textarea id="codeInput" required rows="6" placeholder="Paste your code here..."></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" id="cancelBtn" class="secondary-btn">Cancel</button>
                    <button type="submit" class="primary-btn">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
